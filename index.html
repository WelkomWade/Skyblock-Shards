<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skyblock Fragment Profit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Fragment Profit Tracker</h1>
    <div class="mode-toggle">
      <button id="orderMode" class="active">Buy Order</button>
      <button id="instantMode">Instant Buy</button>
    </div>
  </header>

  <main>
    <div id="loading">Loading bazaar data...</div>
    <table id="fragmentTable" class="hidden">
      <thead>
        <tr>
          <th>Fragment</th>
          <th>Buy Price</th>
          <th>Sell Price</th>
          <th>Profit</th>
          <th>Volume</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </main>

  <footer>
    <p>Data from Hypixel API • Updated live</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
